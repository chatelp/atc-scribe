<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clairance, listening">
  <title>Clairance — the sign lit: the listening state</title>
  <!-- R2, kept as a state of the sign (13/10): the same scope, its screen lit.
       The disc takes surface.selected (#163020), the ring and range ring the
       accent, the sweep accent.strong, the blip text.primary. Same geometry
       as signe.svg, so the switch between the two reads as the screen lighting
       up, not as another sign. -->
  <circle cx="32" cy="32" r="28.5" fill="#163020"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#4caf50" stroke-width="4"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#4caf50" stroke-width="2" opacity="0.55"/>
  <path d="M32 32 L32 6 A26 26 0 0 1 50.385 13.615 Z" fill="#4caf50" fill-opacity="0.45"/>
  <path d="M32 32 L50.385 13.615" fill="none" stroke="#66c56a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="39.18" cy="16.59" r="3.8" fill="#e0e0e0"/>
</svg>
