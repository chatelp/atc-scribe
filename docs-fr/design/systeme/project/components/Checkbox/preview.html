<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkbox — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px;">
<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
  <label class="cl-check is-on"><span class="cl-check__box"></span>Play sounds for emergencies</label>
  <label class="cl-check"><span class="cl-check__box"></span>Show the PAR at start</label>
  <span style="display:inline-flex;gap:8px;align-items:center"><span class="cl-switch is-on" role="switch" aria-checked="true"></span>Transcription</span>
  <span style="display:inline-flex;gap:8px;align-items:center"><span class="cl-switch" role="switch" aria-checked="false"></span>Light map</span>
</div>
</div>
</body>
</html>
