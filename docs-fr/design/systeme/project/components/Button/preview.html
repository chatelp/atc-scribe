<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px;">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <button class="cl-btn cl-btn--primary">Sign in</button>
  <button class="cl-btn">Retry</button>
  <button class="cl-btn cl-btn--quiet">Close</button>
  <button class="cl-btn cl-btn--icon" aria-label="Event log"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1.5 1.5h-11L4 11ZM6.5 14h3"/></svg></button>
  <button class="cl-btn cl-btn--icon" aria-label="Settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5ZM8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
  <button class="cl-btn" disabled>Play</button>
</div>
</div>
</body>
</html>
