<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px;">
<div style="display:flex;flex-direction:column;gap:16px;max-width:356px">
  <div class="cl-altrange">
    <div class="cl-altrange__head"><span class="cl-label">Altitude</span><span class="cl-altrange__value">SFC – FL 195 <small>· 64 of 107</small></span></div>
    <div class="cl-altrange__histo"><i class="is-in" style="height:40%"></i><i class="is-in" style="height:70%"></i><i class="is-in" style="height:55%"></i><i class="is-in" style="height:30%"></i><i class="is-in" style="height:45%"></i><i class="is-in" style="height:60%"></i><i class="is-in" style="height:35%"></i><i class="is-in" style="height:50%"></i><i class="is-in" style="height:25%"></i><i style="height:40%"></i><i style="height:65%"></i><i style="height:90%"></i><i style="height:100%"></i><i style="height:75%"></i><i style="height:30%"></i><i style="height:10%"></i></div>
    <div class="cl-slider"><span class="cl-slider__rail"></span><span class="cl-slider__fill" style="left:0;width:56%"></span><span class="cl-slider__thumb" style="left:0"></span><span class="cl-slider__thumb" style="left:56%"></span></div>
    <div class="cl-altrange__marks"><span>SFC</span><span>TA 5000</span><span>FL 100</span><span>FL 195</span><span>∞</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px"><span class="cl-label" style="width:60px">Volume</span><div class="cl-slider" style="flex:1"><span class="cl-slider__rail"></span><span class="cl-slider__fill" style="left:0;width:70%"></span><span class="cl-slider__thumb" style="left:70%"></span></div></div>
</div>
</div>
</body>
</html>
