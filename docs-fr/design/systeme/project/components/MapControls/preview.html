<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MapControls — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px;">
<div class="cl-menu cl-menu--map" role="dialog" aria-label="Layers and base map">
  <div class="cl-menu__head"><span class="cl-menu__title">Base map</span></div>
  <div class="cl-seg"><button class="cl-seg__item" aria-pressed="false">IGN dark</button><button class="cl-seg__item" aria-pressed="false">IGN</button><button class="cl-seg__item" aria-pressed="false">OSM dark</button><button class="cl-seg__item" aria-pressed="false">OSM</button><button class="cl-seg__item" aria-pressed="true">None</button></div>
  <div class="cl-menu__sep"></div>
  <div class="cl-menu__group"><span class="cl-label">Aircraft</span><div class="cl-menu__row"><span class="cl-switch is-on" role="switch" aria-checked="true"></span><span class="cl-menu__label">Labels</span></div><div class="cl-menu__row"><span class="cl-switch is-on" role="switch" aria-checked="true"></span><span class="cl-menu__label">Tracks, last 3 min</span><div class="cl-slider cl-slider--short"><span class="cl-slider__rail"></span><span class="cl-slider__fill" style="left:0;width:30%"></span><span class="cl-slider__thumb" style="left:30%"></span></div></div></div>
  <div class="cl-menu__sep"></div>
  <div class="cl-menu__group"><span class="cl-label">Layers</span><div class="cl-menu__row"><span class="cl-switch is-on" role="switch" aria-checked="true"></span><span class="cl-menu__label">Distance rings</span><div class="cl-slider cl-slider--short"><span class="cl-slider__rail"></span><span class="cl-slider__fill" style="left:0;width:60%"></span><span class="cl-slider__thumb" style="left:60%"></span></div></div><div class="cl-menu__row"><span class="cl-switch" role="switch" aria-checked="false"></span><span class="cl-menu__label">Airspace</span></div><div class="cl-menu__row"><span class="cl-switch is-on" role="switch" aria-checked="true"></span><span class="cl-menu__label">Airport layout</span></div></div>
</div>
</div>
</body>
</html>
