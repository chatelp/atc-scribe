<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ThreadHead — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px;">
<div class="cl-threadhead" style="max-width: 440px; background: var(--color-surface-panel);">
  <div class="cl-threadhead__row"><h2 class="cl-threadhead__title">Radio</h2><span class="cl-exchange__when">5 exchanges in the last 2 min</span><span class="cl-threadhead__end"><button class="cl-btn cl-btn--icon" aria-label="Search the thread"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg></button><button class="cl-btn">Mute all</button></span></div>
  <div class="cl-threadhead__row"><span class="cl-channel cl-channel--split is-on"><button class="cl-channel__main" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6h3l4-3v10L5 10H2z"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M11 5.5a3.5 3.5 0 0 1 0 5"/></svg><span class="cl-channel__freq">124.350</span> Approche</button><button class="cl-channel__caret" aria-label="124.350: volume and options"><svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m3 6 5 5 5-5"/></svg></button></span><span class="cl-channel cl-channel--split"><button class="cl-channel__main" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6h3l4-3v10L5 10H2z"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="m11 6 4 4m0-4-4 4"/></svg><span class="cl-channel__freq">126.425</span> App. (L)</button><button class="cl-channel__caret" aria-label="126.425: volume and options"><svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m3 6 5 5 5-5"/></svg></button></span></div>
  <div class="cl-threadhead__row"><span class="cl-label">Show</span><div class="cl-seg"><button class="cl-seg__item" aria-pressed="true">All</button><button class="cl-seg__item" aria-pressed="false">124.350</button><button class="cl-seg__item" aria-pressed="false">126.425</button></div></div>
</div>
</div>
</body>
</html>
