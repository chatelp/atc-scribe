<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px;">
<div style="display:flex;flex-direction:column;gap:20px;max-width:380px">
  <div class="cl-tabs cl-tabs--column" role="tablist" style="background:var(--color-surface-panel)">
    <button class="cl-tabs__tab" role="tab" aria-selected="true">Right now</button>
    <button class="cl-tabs__tab" role="tab" aria-selected="false">Traffic <span class="cl-tabs__count">110</span></button>
    <span class="cl-tabs__end"><button class="cl-btn cl-btn--icon cl-mono" aria-label="Fold the column">»</button></span>
  </div>
  <div class="cl-tabs" role="tablist">
    <button class="cl-tabs__tab" role="tab" aria-selected="true">Active <span class="cl-tabs__count">110</span></button>
    <button class="cl-tabs__tab" role="tab" aria-selected="false">Signal lost <span class="cl-tabs__count">22</span></button>
  </div>
</div>
</div>
</body>
</html>
