<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ChannelMenu — preview</title>
<style>html, body { margin: 0; background: var(--color-surface-page); }</style></head>
<body>
<div class="cl-root" style="padding: 16px;">
<div style="display:flex;flex-direction:column;gap:6px;"><span class="cl-channel cl-channel--split is-on is-menu-open"><button class="cl-channel__main" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6h3l4-3v10L5 10H2z"/><path fill="none" stroke="currentColor" stroke-width="1.5" d="M11 5.5a3.5 3.5 0 0 1 0 5"/></svg><span class="cl-channel__freq">124.350</span> Approche</button><button class="cl-channel__caret" aria-label="124.350: volume and options"><svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m3 6 5 5 5-5"/></svg></button></span>
<div class="cl-menu" role="dialog" aria-label="124.350">
  <div class="cl-menu__head"><span class="cl-channel__freq cl-menu__title">124.350</span><span class="cl-menu__title">Approche De Gaulle</span></div>
  <div class="cl-menu__row"><span class="cl-light cl-light--ok">Listening in this browser</span></div>
  <div class="cl-menu__row"><span class="cl-label">Volume</span><div class="cl-slider"><span class="cl-slider__rail"></span><span class="cl-slider__fill" style="left:0;width:70%"></span><span class="cl-slider__thumb" style="left:70%"></span></div><span class="cl-channel__age">70 %</span></div>
  <div class="cl-menu__sep"></div>
  <label class="cl-check"><span class="cl-check__box"></span>Only this frequency in the thread</label>
  <span class="cl-plain">Last transmission 8 s ago · 41 today. On air because the station chose it.</span>
</div></div>
</div>
</body>
</html>
