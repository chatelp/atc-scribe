<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<link rel="stylesheet" href="../systeme/project/tokens.css">
<link rel="stylesheet" href="../systeme/project/components/bundle.css">
</head>
<body style="margin: 0; width: 1440px; height: 900px;">
<div class="cl-root cl-app">
<div class="cl-signin"><div class="cl-signin__card">
<span class="cl-signin__mark"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26.5" fill="none" stroke="#e0e0e0" stroke-width="4"/><circle cx="32" cy="32" r="13" fill="none" stroke="#e0e0e0" stroke-width="2" opacity="0.55"/><path d="M32 32 L32 6 A26 26 0 0 1 50.385 13.615 Z" fill="#4caf50" fill-opacity="0.35"/><path d="M32 32 L50.385 13.615" fill="none" stroke="#4caf50" stroke-width="4" stroke-linecap="round"/><circle cx="39.18" cy="16.59" r="3.8" fill="#4caf50"/></svg>Clairance</span>
<span class="cl-plain">Hear the airband you receive, read it in English and French, and see which aircraft is speaking.</span>
<label class="cl-signin__field"><span class="cl-label">User</span><input class="cl-input" autocomplete="username"></label>
<label class="cl-signin__field"><span class="cl-label">Password</span><input class="cl-input" type="password" autocomplete="current-password"></label>
<button class="cl-btn cl-btn--primary">Sign in</button>
<span class="cl-plain">After 8 failed tries, wait 15 minutes.</span>
</div></div>
</div>
</body>
</html>
