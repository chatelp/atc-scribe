<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="Clairance">
  <title>Clairance — the mark: sign and name</title>
  <!-- The sign at 40 px (the 64 grid scaled by 0.625), then the name. The name
       is typed, not drawn: it takes the viewer's monospace, exactly as the
       interface does (principle 8), so no font is shipped. Clear space around
       the mark: half the sign's height, 20 px here. -->
  <g transform="translate(4 4) scale(0.625)">
    <circle cx="32" cy="32" r="26.5" fill="none" stroke="#e0e0e0" stroke-width="4"/>
    <circle cx="32" cy="32" r="13" fill="none" stroke="#e0e0e0" stroke-width="2" opacity="0.55"/>
    <path d="M32 32 L32 6 A26 26 0 0 1 50.385 13.615 Z" fill="#4caf50" fill-opacity="0.35"/>
    <path d="M32 32 L50.385 13.615" fill="none" stroke="#4caf50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="39.18" cy="16.59" r="3.8" fill="#4caf50"/>
  </g>
  <text x="54" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="600" fill="#e0e0e0">Clairance</text>
</svg>
