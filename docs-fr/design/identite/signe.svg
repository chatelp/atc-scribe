<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clairance">
  <title>Clairance — the sign: a runway and the cleared check</title>
  <!-- 64 grid. The runway: a bar with its centreline. The check: the aircraft
       comes down from the left and touches the runway at the vertex. Strokes
       of 8 on 64, i.e. 2 on 16: the sign survives at 16 px (signe-16.svg). -->
  <rect x="8" y="48" width="48" height="8" rx="4" fill="#e0e0e0"/>
  <g fill="#1a1a1a"><rect x="19" y="51" width="8" height="2" rx="1"/><rect x="32" y="51" width="8" height="2" rx="1"/><rect x="45" y="51" width="6" height="2" rx="1"/></g>
  <path d="M16 32 28 44 52 20" fill="none" stroke="#4caf50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
