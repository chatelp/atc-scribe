<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clairance">
  <title>Clairance — the sign: the aircraft climbing away from the runway, cleared for take-off</title>
  <!-- The aircraft is a 16-grid pictogram (nose up, centred on 8,8), in the
       spirit of the airport pictograms; here scaled 3.3 and turned 45° so it
       climbs to the upper right. The runway it leaves is the bar under its
       tail; it appears from 32 px up (signe-16.svg has the aircraft alone). -->
  <rect x="3" y="55" width="28" height="6" rx="3" fill="#e0e0e0"/>
  <path d="M8 1 L10 3.5 L10 5 L15 10.5 L15 12.5 L10 9.5 L10 12 L11.8 13.8 L11.8 15.2 L8 14 L4.2 15.2 L4.2 13.8 L6 12 L6 9.5 L1 12.5 L1 10.5 L6 5 L6 3.5 Z" fill="#4caf50" transform="translate(36 26) rotate(45) scale(3.3) translate(-8 -8)"/>
</svg>
