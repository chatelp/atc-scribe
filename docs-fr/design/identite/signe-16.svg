<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Clairance">
  <title>Clairance — the sign at 16 px</title>
  <!-- The 64 grid divided by four, the range ring dropped (it would be a grey
       smudge), strokes thickened from 1 to 1.6 so that they keep a full pixel. -->
  <circle cx="8" cy="8" r="6.6" fill="none" stroke="#e0e0e0" stroke-width="1.6"/>
  <path d="M8 8 L8 1.6 A6.4 6.4 0 0 1 12.525 3.475 Z" fill="#4caf50" fill-opacity="0.35"/>
  <path d="M8 8 L12.525 3.475" fill="none" stroke="#4caf50" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="9.78" cy="4.19" r="1.15" fill="#4caf50"/>
</svg>
