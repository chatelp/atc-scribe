<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="Clairance stopped">
  <title>Menu bar, production stopped: the runway and the hold-short line</title>
  <!-- Same template rules. Stopped differs by shape, not only by weight: the
       check is gone and a hold-short line sits before the runway, the mark an
       aircraft waits behind until it is cleared. The whole sign at 55 % alpha. -->
  <g transform="translate(1 1)" opacity="0.55">
    <rect x="2" y="12" width="12" height="2" rx="1" fill="#000000"/>
    <rect x="5" y="7" width="6" height="2" rx="1" fill="#000000"/>
  </g>
</svg>
