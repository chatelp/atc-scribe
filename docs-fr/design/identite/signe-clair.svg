<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Clairance">
  <title>Clairance — the sign, for light backgrounds</title>
  <!-- Same geometry as signe.svg; the runway goes dark and the green deepens
       (#2e7d32, 5.1:1 on white) so the check still reads on paper and on a
       light GitHub page. -->
  <rect x="8" y="48" width="48" height="8" rx="4" fill="#1a1a1a"/>
  <g fill="#ffffff"><rect x="19" y="51" width="8" height="2" rx="1"/><rect x="32" y="51" width="8" height="2" rx="1"/><rect x="45" y="51" width="6" height="2" rx="1"/></g>
  <path d="M16 32 28 44 52 20" fill="none" stroke="#2e7d32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
