  <circle cx="32" cy="32" r="13" fill="none" stroke="#1a1a1a" stroke-width="2" opacity="0.4"/>
  <path d="M32 32 L32 6 A26 26 0 0 1 50.385 13.615 Z" fill="#2e7d32" fill-opacity="0.25"/>
  <path d="M32 32 L50.385 13.615" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
  <circle cx="39.18" cy="16.59" r="3.8" fill="#2e7d32"/>
</svg>
